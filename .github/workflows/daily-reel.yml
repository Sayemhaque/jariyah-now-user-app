name: Daily Quran reel

on:
  schedule:
    # Posts go live at Bangladesh time 07:00, 10:00, 13:30, 16:30, 19:30
    # (two reels and three image posts, shuffled daily) and a reel every night
    # at 22:00 (Asia/Dhaka is UTC+6, no DST). GitHub sometimes drops scheduled
    # runs, so each slot has three triggers 33, 23 and 13 minutes early, off the
    # busy :00/:30 marks. The first one renders, waits and publishes just before
    # the slot; the others see the posted marker and stop.
    # Keep in sync with postTimes in src/lib/daily/dailyConfig.ts.
    - cron: '27,37,47 0,3,15 * * *'
    - cron: '57 6,9,12 * * *'
    - cron: '7,17 7,10,13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'now = post immediately; auto = act like the schedule (used by the outside timer)'
        required: false
        default: 'now'
      platforms:
        description: 'Only post to these (comma separated, e.g. youtube). Empty = all'
        required: false
        default: ''
      surah:
        description: 'Post a reel of this surah number now (empty = today''s plan)'
        required: false
        default: ''

# Never run two posting jobs at once (avoids double posts).
concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Render and post
        env:
          # Manual runs post straight away instead of waiting for a slot.
          POST_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.slot != 'auto' }}
          PLATFORMS: ${{ inputs.platforms }}
          SURAH: ${{ inputs.surah }}
          NEXT_PUBLIC_UMMAHAPI_KEY: ${{ secrets.UMMAHAPI_KEY }}
          # YouTube Shorts
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Facebook Page Reels + Instagram Reels
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # TikTok
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: npx tsx daily-reel.ts

