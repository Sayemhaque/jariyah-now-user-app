name: Daily Quran reel

on:
  schedule:
    # One reel a day at 10:00 Bangladesh time (04:00 UTC, Asia/Dhaka is UTC+6,
    # no DST). GitHub checks twice an hour for the next three hours: a run
    # posts the slot if it was missed, and the posted marker makes every
    # other run stop at once. Keep in sync with dailyConfig.ts.
    - cron: '0,17,47 4,5,6 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'now = post immediately; auto = post today''s planned post for this time (used by the Claude Routines)'
        required: false
        default: 'now'
      platforms:
        description: 'Only post to these (comma separated, e.g. youtube). Empty = all'
        required: false
        default: ''
      mode:
        description: 'Post this type now: quran, duaReel, kahf, hadith, azkar, duas, jumuahVirtue, durood or duaHour (empty = today''s plan)'
        required: false
        default: ''
      dua:
        description: 'Post the reel of this Quranic dua id now, e.g. zakariya-offspring (see src/lib/collections/quranicDuas.ts)'
        required: false
        default: ''
      surah:
        description: 'Post a reel of this surah number now (empty = today''s plan)'
        required: false
        default: ''

# Never run two posting jobs at once (avoids double posts).
concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # A cached static ffmpeg build (with ffprobe) instead of apt-get, which took up to three minutes.
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
        continue-on-error: true
        with:
          ffmpeg-version: release

      # Fall back to apt when the static build cannot be downloaded.
      - if: steps.ffmpeg.outcome == 'failure'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Render and post
        env:
          # Manual runs post straight away instead of waiting for a slot.
          POST_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.slot != 'auto' }}
          PLATFORMS: ${{ inputs.platforms }}
          SURAH: ${{ inputs.surah }}
          MODE: ${{ inputs.mode }}
          DUA: ${{ inputs.dua }}
          NEXT_PUBLIC_UMMAHAPI_KEY: ${{ secrets.UMMAHAPI_KEY }}
          # YouTube Shorts
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Facebook Page Reels + Instagram Reels
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # TikTok
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: npx tsx daily-reel.ts

